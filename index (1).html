    <style>
        body {
            font-family: 'Poppins', 'Tiro Devanagari Hindi', sans-serif;
            background-color: #050200;
            background-attachment: fixed;
        }
        
        body[data-theme="cosmic"] {
            background-image: radial-gradient(ellipse at center, rgba(255, 153, 51, 0.12) 0%, transparent 80%);
        }

        /* Ultra-Slow & Subtle Saffron Neon Glow Pulse */
        @keyframes saffron-neon-pulse {
            0%, 100% { 
                box-shadow: 0 0 5px rgba(255, 153, 51, 0.1), inset 0 0 2px rgba(255, 153, 51, 0.05);
                border-color: rgba(255, 153, 51, 0.2);
            }
            50% { 
                box-shadow: 0 0 15px rgba(255, 153, 51, 0.4), inset 0 0 8px rgba(255, 153, 51, 0.2);
                border-color: rgba(255, 153, 51, 0.6);
            }
        }
        
        .saffron-glow-slow {
            animation: saffron-neon-pulse 8s infinite ease-in-out;
            border-width: 1.5px;
            border-style: solid;
            transition: all 1s ease;
        }

        /* Icon Glow Saffron - Slow Flashing for Product Icons */
        @keyframes saffron-flash-slow {
            0%, 100% { opacity: 1; border-color: rgba(255, 153, 51, 0.1); box-shadow: 0 0 0 rgba(255, 153, 51, 0); }
            50% { opacity: 0.8; border-color: rgba(255, 153, 51, 0.6); box-shadow: 0 0 15px rgba(255, 153, 51, 0.3); }
        }

        .icon-glow-saffron {
            animation: saffron-flash-slow 6s infinite ease-in-out;
            border: 1px solid rgba(255, 153, 51, 0.2);
        }

        @keyframes slide-content-in {
            from { opacity: 0; transform: translateX(30px); filter: blur(10px); }
            to { opacity: 1; transform: translateX(0); filter: blur(0); }
        }
        .animate-slide-content {
            animation: slide-content-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .font-hindi { font-family: 'Tiro Devanagari Hindi', serif; }
        
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #ff9933; border-radius: 10px; }

        @keyframes marquee-right-to-left {
            0% { transform: translateX(100vw); }
            100% { transform: translateX(-100%); }
        }
        .animate-marquee-custom {
            display: inline-block;
            white-space: nowrap;
            animation: marquee-right-to-left 40s linear infinite;
        }
